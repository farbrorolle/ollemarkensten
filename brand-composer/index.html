<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Composer</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 data-title>Brand Composer</h1>
        <span class="subtitle">Anpassa musiken till din film</span>
        <div class="view-switch" role="group" aria-label="Vy">
          <button type="button" class="view-switch-btn" data-view="customer">Kundvy</button>
          <button type="button" class="view-switch-btn" data-view="creator">Skaparvy</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel panel-video">
          <h2>Film</h2>
          <div id="video-panel"></div>
        </section>

        <section class="panel panel-transport" id="transport-panel"></section>

        <section class="panel panel-timeline">
          <h2>Musik</h2>
          <p class="hint">Dra i musikens högra kant för att ändra längden – musiken arrangeras om automatiskt. Klicka i tidslinjen för att hoppa.</p>
          <div id="timeline-view"></div>
        </section>

        <section class="panel panel-master creator-only">
          <h2>Master</h2>
          <div id="master-panel"></div>
        </section>

        <section class="panel panel-sidechain creator-only">
          <h2>Sidechain</h2>
          <div id="sidechain-panel"></div>
        </section>

        <section class="panel panel-logo creator-only">
          <h2>Ljudlogga</h2>
          <div id="logo-panel"></div>
        </section>

        <section class="panel panel-tracks">
          <h2>Mixer</h2>
          <div class="track-list-header">
            <span></span><span>Volym</span><span class="creator-only">Pan</span><span>Mute</span><span class="creator-only">Solo</span>
          </div>
          <div id="track-list"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
